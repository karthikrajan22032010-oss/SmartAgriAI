services:
  # Backend API Web Service
  - type: web
    name: smartagriai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"

  # Frontend Web Dashboard Static Site
  - type: web
    name: smartagriai-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartagriai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
